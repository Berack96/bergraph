[workspace]
resolver = "3"
members = ["crates/bergraph", "crates/bergraph-derive"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Berack96/bergraph"

[workspace.dependencies]
bergraph-derive = { path = "crates/bergraph-derive" }

# CI runs without incremental compilation: no cache is reused between runs, so
# incremental only adds overhead there.
[profile.ci]
inherits = "dev"
incremental = false
