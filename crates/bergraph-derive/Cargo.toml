[package]
name = "bergraph-derive"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Attribute macros for bergraph"
documentation = "https://docs.rs/bergraph-derive"
keywords = ["graph", "serde", "derive"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "3.0.5", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"

[features]
default = []
serde = []
